server:
  port: 9898
spring:
  profiles:
    active: "dev"
  aop:
    auto: true
    proxy-target-class: true
  servlet:
    multipart:
      enabled: true
      max-request-size: 15MB
      max-file-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/dbname?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
    username: ""
    password: ""
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 1       # 最小連接數
      maximum-pool-size: 10 # 最大連接數
      auto-commit: true     # 自動提交
  # 線程池設定
  task:
    execution:
      pool:
        max-size: 4 #最大線程數量
        core-size: 2 #初始化線程數量
        queue-capacity: 10000 #隊列最大長度
        keep-alive: 60s #線程終止前允許保存的最大時間
      shutdown:
        await-termination: true
      thread-name-prefix: "playedu-default-thread"

mybatis:
  mapper-locations: classpath:mapper/*.xml

mybatis-plus:
  global-config:
    banner: false

sa-token:
  is-print: false
  token-name: "Authorization"
  timeout: 1296000 #token有效期[單位:秒,預設15天]
  is-concurrent: false #限制同時登入
  is-share: false
  jwt-secret-key: "playeduxyz"
  token-prefix: "Bearer"
  is-log: false
  log-level: "warn"

playedu:
  core:
    testing: false
  limiter:
    duration: 60
    limit: 360
